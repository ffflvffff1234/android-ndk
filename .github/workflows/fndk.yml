name: Fetch Latest Android NDK

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-ndk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Detect latest NDK
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          XML="$(curl -fsSL https://dl.google.com/android/repository/repository2-3.xml)"

          VER="$(printf '%s' "$XML" \
            | grep -oE '<remotePackage path="ndk;[^"]+"' \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?(-beta[0-9]+)?' \
            | grep -vE -- '-(rc|beta)[0-9]+$' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -n1)"

          [ -n "$VER" ] || { echo "::error::未能解析最新 NDK 版本"; exit 1; }

          SHORT="r${VER%%.*}"
          FILE="android-ndk-${SHORT}-linux.zip"
          URL="https://dl.google.com/android/repository/${FILE}"

          curl -fI --silent "$URL" >/dev/null \
            || { echo "::error::${URL} 不可访问，包名规律可能已变化"; exit 1; }

          {
            echo "version=${VER}"
            echo "short=${SHORT}"
            echo "file=${FILE}"
            echo "url=${URL}"
          } >> "$GITHUB_OUTPUT"

          echo "latest: ${VER} (${SHORT}) -> ${URL}"

      - name: Check if already up to date
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${{ steps.detect.outputs.file }}" ]; then
            echo "仓库里已有 ${{ steps.detect.outputs.file }}，无需更新"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download NDK zip
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --progress-bar \
            -o "${{ steps.detect.outputs.file }}" \
            "${{ steps.detect.outputs.url }}"

      - name: Verify and record
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ steps.detect.outputs.file }}"

          unzip -tq "$FILE" >/dev/null || { echo "::error::zip 损坏"; exit 1; }

          SUM="$(sha256sum "$FILE" | awk '{print $1}')"
          echo "sha256: ${SUM}"

          {
            echo "ndk_version=${{ steps.detect.outputs.version }}"
            echo "ndk_short=${{ steps.detect.outputs.short }}"
            echo "file=${FILE}"
            echo "source_url=${{ steps.detect.outputs.url }}"
            echo "sha256=${SUM}"
            echo "updated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${FILE%.zip}.info"

      - name: Commit to repo root
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          FILE="${{ steps.detect.outputs.file }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE" "${FILE%.zip}.info"
          git diff --cached --quiet && { echo "无变化，跳过"; exit 0; }

          git commit -m "chore: update Android NDK ${{ steps.detect.outputs.version }} (linux)"
          git push
